<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minecraft 2D</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body>
  <h1 class="game-title">MINECRAFT-2D</h1>

  <div id="world"></div>

  <div class="bottom-bar">
    <div id="toolbar">
      <div class="tool" id="axe">🪓</div>
      <div class="tool" id="pickaxe">⛏️</div>
      <div class="tool" id="shovel">🧹</div>
    </div>

    <div id="inventory">
      <div class="inv-item" id="inv-grass">
        <div class="tile tile-grass small"></div>
        <span id="count-grass">0</span>
      </div>
      <div class="inv-item" id="inv-dirt">
        <div class="tile tile-dirt small"></div>
        <span id="count-dirt">0</span>
      </div>
      <div class="inv-item" id="inv-rock">
        <div class="tile tile-rock small"></div>
        <span id="count-rock">0</span>
      </div>
      <div class="inv-item" id="inv-wood">
        <div class="tile tile-wood small"></div>
        <span id="count-wood">0</span>
      </div>
      <div class="inv-item" id="inv-leaves">
        <div class="tile tile-leaves small"></div>
        <span id="count-leaves">0</span>
      </div>
    </div>

    <button id="reset-btn">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
